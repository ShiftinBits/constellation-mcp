name: Publish
permissions:
  id-token: write
  contents: write
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Update version from release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "Version already matches ($VERSION), skipping bump."
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version
          jq --tab --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          jq --tab --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.json manifest.json
          git commit -m "chore: bumped version to $VERSION for release"
          git push origin main
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --provenance --registry https://registry.npmjs.org
      - name: Wait for npm propagation
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            if npm view "@constellationdev/mcp@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "npm is serving $VERSION"
              exit 0
            fi
            echo "waiting for npm to serve $VERSION (attempt $i)..."
            sleep 15
          done
          echo "::error::npm did not serve $VERSION within 10 minutes"
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: ./mcp-publisher login dns --domain shiftinbits.com --private-key "$MCP_PRIVATE_KEY"
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
  pin-claude-plugin:
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Open draft PR pinning the new version in constellation-claude
        env:
          GH_TOKEN: ${{ secrets.CONSTELLATION_CLAUDE_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          VERSION="${TAG_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag '$TAG_NAME'"
            exit 1
          fi
          BRANCH="feat/pin-mcp-$VERSION"
          gh auth setup-git
          gh repo clone ShiftinBits/constellation-claude plugin -- --depth 1
          cd plugin
          git checkout -b "$BRANCH"
          sed -i -E "s#@constellationdev/mcp@[0-9]+\.[0-9]+\.[0-9]+#@constellationdev/mcp@$VERSION#g" \
            .mcp.json skills/constellation-troubleshooting/SKILL.md commands/diagnose.md
          if git diff --quiet; then
            echo "constellation-claude already pins $VERSION, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: pin @constellationdev/mcp to $VERSION"
          git push origin "$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "Pin @constellationdev/mcp to $VERSION" \
            --body "Pins the Constellation MCP server to \`$VERSION\` following its [release]($RELEASE_URL)."
